{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:720px">
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  {% if retrain %}
  <button class="btn" data-run-pipeline>Run analysis &amp; train models</button>
  <div id="pipe-status" class="alert alert-info" style="display:none;margin-top:16px"><span class="msg"></span><div class="progress"><div></div></div></div>
  {% else %}
  <a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
  {% endif %}
</div>
{% endblock %}
